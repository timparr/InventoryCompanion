<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">Custom Groups editor schematic</title>
  <desc id="desc">Illustrative group editor with group list, new group button, editable name, wildcard patterns, and group actions.</desc>
  <defs>
    <style>
      .bg { fill: #17191e; }
      .panel { fill: #242832; stroke: #78808d; stroke-width: 2; }
      .inner { fill: #20242c; stroke: #505866; }
      .row { fill: #303540; stroke: #444b57; }
      .selected { fill: #3b4654; stroke: #8bb8dc; }
      .header { fill: #e8c878; font: 700 19px Arial, sans-serif; }
      .text { fill: #f0eee7; font: 15px Arial, sans-serif; }
      .muted { fill: #b7bdc7; font: 13px Arial, sans-serif; }
      .callout { fill: #172535; stroke: #73b9e6; stroke-width: 1.5; }
      .calloutText { fill: #d8efff; font: 14px Arial, sans-serif; }
      .line { stroke: #73b9e6; stroke-width: 2; fill: none; }
      .button { fill: #4a5361; stroke: #aab2c0; }
      .field { fill: #15181e; stroke: #8b94a2; }
      .number { fill: #297d62; stroke: #a8e0c9; stroke-width: 1.5; }
      .numberText { fill: #ffffff; font: 700 14px Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1040" height="440" rx="14"/>
  <text class="header" x="30" y="34">Manage Tracked Groups — illustrative editor</text>
  <rect class="panel" x="24" y="52" width="992" height="340" rx="8"/>
  <text class="header" x="48" y="84">Manage Tracked Groups</text>
  <rect class="field" x="48" y="101" width="202" height="30" rx="4"/>
  <text class="muted" x="63" y="121">Search groups</text>
  <rect class="button" x="858" y="101" width="132" height="30" rx="5"/>
  <text class="text" x="873" y="121">+ New Group</text>
  <circle class="number" cx="976" cy="83" r="13"/>
  <text class="numberText" x="976" y="88">1</text>

  <rect class="inner" x="48" y="145" width="265" height="224" rx="6"/>
  <text class="muted" x="65" y="170">GROUP LIST</text>
  <rect class="selected" x="60" y="181" width="240" height="34" rx="4"/>
  <text class="text" x="76" y="203">Rare Mats</text>
  <rect class="row" x="60" y="222" width="240" height="34" rx="4"/>
  <text class="text" x="76" y="244">Treasure Maps</text>
  <rect class="row" x="60" y="263" width="240" height="34" rx="4"/>
  <text class="text" x="76" y="285">Surveys</text>
  <rect class="row" x="60" y="304" width="240" height="34" rx="4"/>
  <text class="text" x="76" y="326">Miscellaneous</text>

  <rect class="inner" x="331" y="145" width="659" height="224" rx="6"/>
  <text class="header" x="352" y="178">Group Name: Rare Mats</text>
  <rect class="field" x="352" y="190" width="600" height="38" rx="4"/>
  <text class="text" x="367" y="214">*nirncrux*</text>
  <circle class="number" cx="975" cy="177" r="13"/>
  <text class="numberText" x="975" y="182">2</text>
  <rect class="button" x="960" y="195" width="28" height="28" rx="4"/>
  <text class="text" x="968" y="215">×</text>
  <rect class="field" x="352" y="237" width="600" height="38" rx="4"/>
  <text class="text" x="367" y="261">perfect roe</text>
  <rect class="button" x="960" y="242" width="28" height="28" rx="4"/>
  <text class="text" x="968" y="262">×</text>
  <rect class="button" x="352" y="286" width="144" height="30" rx="5"/>
  <text class="text" x="368" y="306">+ Add Pattern</text>
  <rect class="button" x="352" y="326" width="118" height="28" rx="5"/>
  <text class="text" x="367" y="345">Hide Group</text>
  <rect class="button" x="480" y="326" width="125" height="28" rx="5"/>
  <text class="text" x="493" y="345">Delete Group</text>

  <circle class="number" cx="975" cy="309" r="13"/>
  <text class="numberText" x="975" y="314">3</text>
  <rect class="callout" x="48" y="406" width="294" height="58" rx="6"/>
  <circle class="number" cx="69" cy="435" r="13"/>
  <text class="numberText" x="69" y="440">1</text>
  <text class="calloutText" x="91" y="430">Create a group, then select it</text>
  <text class="calloutText" x="91" y="449">from the list.</text>
  <rect class="callout" x="373" y="406" width="294" height="58" rx="6"/>
  <circle class="number" cx="394" cy="435" r="13"/>
  <text class="numberText" x="394" y="440">2</text>
  <text class="calloutText" x="416" y="430">Each pattern is an OR match;</text>
  <text class="calloutText" x="416" y="449">* matches any text.</text>
  <rect class="callout" x="698" y="406" width="294" height="58" rx="6"/>
  <circle class="number" cx="719" cy="435" r="13"/>
  <text class="numberText" x="719" y="440">3</text>
  <text class="calloutText" x="741" y="430">Rename, hide, or delete groups</text>
  <text class="calloutText" x="741" y="449">using the group controls.</text>
  <text class="muted" x="30" y="486">Schematic only — labels and layout simplified; the in-game panel may vary.</text>
</svg>
