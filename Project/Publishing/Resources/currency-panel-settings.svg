<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
  <title id="title">Currency Summary Panel settings schematic</title>
  <desc id="desc">Illustrative settings list showing currency location toggles, Notify, visibility, and reorder controls.</desc>
  <defs>
    <style>
      .bg { fill: #17191e; }
      .panel { fill: #242832; stroke: #78808d; stroke-width: 2; }
      .row { fill: #303540; stroke: #444b57; }
      .header { fill: #e8c878; font: 700 19px Arial, sans-serif; }
      .text { fill: #f0eee7; font: 16px Arial, sans-serif; }
      .muted { fill: #b7bdc7; font: 14px Arial, sans-serif; }
      .callout { fill: #172535; stroke: #73b9e6; stroke-width: 1.5; }
      .calloutText { fill: #d8efff; font: 14px Arial, sans-serif; }
      .check { fill: #297d62; stroke: #a8e0c9; stroke-width: 1.5; }
      .button { fill: #4a5361; stroke: #aab2c0; }
      .number { fill: #297d62; stroke: #a8e0c9; stroke-width: 1.5; }
      .numberText { fill: #ffffff; font: 700 14px Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1040" height="450" rx="14"/>
  <text class="header" x="30" y="34">Currency Summary Panel — illustrative settings</text>
  <rect class="panel" x="24" y="52" width="992" height="278" rx="8"/>
  <text class="header" x="46" y="84">Shown in panel (2)</text>
  <text class="muted" x="538" y="84">Character</text>
  <text class="muted" x="656" y="84">Bank</text>
  <text class="muted" x="756" y="84">Notify</text>
  <text class="muted" x="850" y="84">Show/hide</text>
  <text class="muted" x="949" y="84">Order</text>

  <rect class="row" x="40" y="98" width="960" height="54" rx="5"/>
  <text class="text" x="58" y="131">Gold</text>
  <rect class="check" x="566" y="113" width="20" height="20" rx="3"/>
  <path d="M571 123l5 5 8-10" stroke="#fff" stroke-width="2" fill="none"/>
  <rect class="check" x="681" y="113" width="20" height="20" rx="3"/>
  <path d="M686 123l5 5 8-10" stroke="#fff" stroke-width="2" fill="none"/>
  <rect class="check" x="781" y="113" width="20" height="20" rx="3"/>
  <path d="M786 123l5 5 8-10" stroke="#fff" stroke-width="2" fill="none"/>
  <rect class="button" x="875" y="109" width="36" height="28" rx="4"/>
  <text class="text" x="887" y="129">−</text>
  <rect class="button" x="928" y="109" width="29" height="28" rx="4"/>
  <text class="text" x="937" y="129">↑</text>
  <rect class="button" x="963" y="109" width="29" height="28" rx="4"/>
  <text class="text" x="972" y="129">↓</text>
  <circle class="number" cx="719" cy="108" r="13"/>
  <text class="numberText" x="719" y="113">1</text>
  <circle class="number" cx="813" cy="108" r="13"/>
  <text class="numberText" x="813" y="113">2</text>
  <circle class="number" cx="978" cy="148" r="13"/>
  <text class="numberText" x="978" y="153">3</text>

  <rect class="row" x="40" y="160" width="960" height="54" rx="5"/>
  <text class="text" x="58" y="193">Backpack space</text>
  <rect class="check" x="781" y="175" width="20" height="20" rx="3"/>
  <path d="M786 185l5 5 8-10" stroke="#fff" stroke-width="2" fill="none"/>
  <rect class="button" x="875" y="171" width="36" height="28" rx="4"/>
  <text class="text" x="887" y="191">−</text>
  <rect class="button" x="928" y="171" width="29" height="28" rx="4"/>
  <text class="text" x="937" y="191">↑</text>
  <rect class="button" x="963" y="171" width="29" height="28" rx="4"/>
  <text class="text" x="972" y="191">↓</text>
  <text class="muted" x="58" y="251">Currencies have location toggles; capacity rows have Notify but no Character/Bank split.</text>

  <rect class="callout" x="36" y="342" width="310" height="62" rx="6"/>
  <circle class="number" cx="59" cy="373" r="13"/>
  <text class="numberText" x="59" y="378">1</text>
  <text class="calloutText" x="82" y="368">Choose which character and bank</text>
  <text class="calloutText" x="82" y="387">balances to include.</text>
  <rect class="callout" x="365" y="342" width="310" height="62" rx="6"/>
  <circle class="number" cx="388" cy="373" r="13"/>
  <text class="numberText" x="388" y="378">2</text>
  <text class="calloutText" x="411" y="368">Enable alerts when this resource</text>
  <text class="calloutText" x="411" y="387">changes.</text>
  <rect class="callout" x="694" y="342" width="310" height="62" rx="6"/>
  <circle class="number" cx="717" cy="373" r="13"/>
  <text class="numberText" x="717" y="378">3</text>
  <text class="calloutText" x="740" y="368">Hide/show rows and reorder</text>
  <text class="calloutText" x="740" y="387">resources with the arrows.</text>
  <text class="muted" x="30" y="430">Schematic only — labels and layout simplified; the in-game panel may vary.</text>
</svg>
