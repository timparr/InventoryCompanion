<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">Tracked Items editor schematic</title>
  <desc id="desc">Illustrative item editor with profile controls, filters, search, and a sample tracked-item row.</desc>
  <defs>
    <style>
      .bg { fill: #17191e; }
      .panel { fill: #242832; stroke: #78808d; stroke-width: 2; }
      .row { fill: #303540; stroke: #444b57; }
      .header { fill: #e8c878; font: 700 19px Arial, sans-serif; }
      .text { fill: #f0eee7; font: 15px Arial, sans-serif; }
      .muted { fill: #b7bdc7; font: 13px Arial, sans-serif; }
      .callout { fill: #172535; stroke: #73b9e6; stroke-width: 1.5; }
      .calloutText { fill: #d8efff; font: 14px Arial, sans-serif; }
      .button { fill: #4a5361; stroke: #aab2c0; }
      .active { fill: #297d62; stroke: #a8e0c9; stroke-width: 1; }
      .number { fill: #297d62; stroke: #a8e0c9; stroke-width: 1.5; }
      .numberText { fill: #ffffff; font: 700 14px Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1040" height="500" rx="14"/>
  <text class="header" x="30" y="34">Manage Tracked Items — illustrative editor</text>
  <rect class="panel" x="24" y="52" width="992" height="326" rx="8"/>
  <text class="header" x="48" y="84">Manage Tracked Items</text>
  <rect class="button" x="842" y="64" width="112" height="30" rx="5"/>
  <text class="text" x="862" y="84">Edit Groups</text>

  <rect class="active" x="48" y="105" width="154" height="30" rx="5"/>
  <text class="text" x="62" y="125">Use Character List</text>
  <rect class="button" x="224" y="105" width="128" height="30" rx="5"/>
  <text class="text" x="237" y="125">Import from:</text>
  <rect class="button" x="363" y="105" width="112" height="30" rx="5"/>
  <text class="text" x="389" y="125">Character A</text>
  <rect class="button" x="487" y="105" width="72" height="30" rx="5"/>
  <text class="text" x="503" y="125">Import</text>
  <text class="muted" x="573" y="124">Preview: replace 8 entries with 12</text>
  <circle class="number" cx="590" cy="104" r="13"/>
  <text class="numberText" x="590" y="109">1</text>

  <rect class="row" x="44" y="149" width="952" height="50" rx="5"/>
  <text class="text" x="60" y="179">Filters:</text>
  <rect class="active" x="124" y="159" width="68" height="30" rx="4"/>
  <text class="text" x="137" y="179">Show</text>
  <rect class="active" x="200" y="159" width="84" height="30" rx="4"/>
  <text class="text" x="211" y="179">Notify</text>
  <rect class="button" x="292" y="159" width="83" height="30" rx="4"/>
  <text class="text" x="304" y="179">Inactive</text>
  <rect class="button" x="383" y="159" width="93" height="30" rx="4"/>
  <text class="text" x="395" y="179">Untracked</text>
  <rect class="button" x="779" y="159" width="199" height="30" rx="4"/>
  <text class="muted" x="795" y="179">Search tracked entries</text>
  <circle class="number" cx="490" cy="155" r="13"/>
  <text class="numberText" x="490" y="160">2</text>

  <text class="muted" x="60" y="226">Item / group</text>
  <rect class="row" x="44" y="236" width="952" height="48" rx="5"/>
  <text class="text" x="60" y="266">✦ Nirncrux</text>
  <text class="text" x="650" y="257" text-anchor="middle">Show</text>
  <text class="muted" x="650" y="275" text-anchor="middle">Backpack</text>
  <text class="text" x="810" y="257" text-anchor="middle">Notify</text>
  <text class="muted" x="810" y="275" text-anchor="middle">Chat</text>
  <rect class="panel" x="700" y="288" width="224" height="72" rx="3"/>
  <rect class="active" x="714" y="300" width="18" height="18" rx="3"/>
  <path d="M717 309l5 5 7-10" stroke="#fff" stroke-width="2" fill="none"/>
  <text class="text" x="742" y="315">Notify Chat</text>
  <rect class="button" x="714" y="329" width="18" height="18" rx="3"/>
  <text class="text" x="742" y="344">Notify HUD</text>
  <rect class="button" x="950" y="246" width="30" height="28" rx="4"/>
  <text class="text" x="959" y="266">×</text>
  <circle class="number" cx="932" cy="231" r="13"/>
  <text class="numberText" x="932" y="236">3</text>

  <rect class="callout" x="45" y="394" width="300" height="62" rx="6"/>
  <circle class="number" cx="68" cy="425" r="13"/>
  <text class="numberText" x="68" y="430">1</text>
  <text class="calloutText" x="91" y="420">Choose a list and import source.</text>
  <text class="calloutText" x="91" y="439">Import replaces the destination.</text>
  <rect class="callout" x="370" y="394" width="300" height="62" rx="6"/>
  <circle class="number" cx="393" cy="425" r="13"/>
  <text class="numberText" x="393" y="430">2</text>
  <text class="calloutText" x="416" y="420">Filters change which entries</text>
  <text class="calloutText" x="416" y="439">are listed for editing.</text>
  <rect class="callout" x="695" y="394" width="300" height="62" rx="6"/>
  <circle class="number" cx="718" cy="425" r="13"/>
  <text class="numberText" x="718" y="430">3</text>
  <text class="calloutText" x="741" y="420">Click Show / Notify for checkboxes.</text>
  <text class="calloutText" x="741" y="439">Changes apply; click away to close.</text>
  <text class="muted" x="30" y="484">Schematic only — labels and layout simplified; the in-game panel may vary.</text>
</svg>
